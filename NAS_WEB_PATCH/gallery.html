<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>照片查询 · 飞牛NAS</title>
  <link rel="stylesheet" href="/style.css?v=30" />
  <style>
    body { background:#0f1115; color:#e8eaed; font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; margin:0; }
    .g-top { position:sticky; top:0; background:#161a21; padding:10px 14px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #23262e; z-index:5; }
    .g-top a { color:#7fb2ff; text-decoration:none; font-size:14px; }
    .g-top h1 { font-size:17px; margin:0; font-weight:700; }
    .g-search { background:#161a21; padding:14px; border-bottom:1px solid #23262e; display:flex; flex-direction:column; gap:10px; }
    .g-row { display:flex; gap:8px; flex-wrap:wrap; }
    .g-row input { flex:1; min-width:110px; background:#0f1115; border:1px solid #2a2e38; color:#e8eaed; border-radius:10px; padding:11px 12px; font-size:15px; box-sizing:border-box; }
    .g-row input::placeholder { color:#6b7280; }
    .g-btn { background:#2f7bff; color:#fff; border:none; border-radius:10px; padding:11px 18px; font-size:15px; font-weight:700; }
    .g-btn:active { transform:scale(.98); }
    .g-btn.ghost { background:#23262e; color:#cfd3da; }
    .g-status { padding:10px 14px; color:#9aa0aa; font-size:13px; min-height:18px; }
    .g-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:8px; padding:10px 14px 40px; }
    .g-card { position:relative; background:#161a21; border-radius:10px; overflow:hidden; aspect-ratio:3/4; cursor:pointer; }
    .g-card img { width:100%; height:100%; object-fit:cover; display:block; }
    .g-card .seq { position:absolute; left:6px; top:6px; background:rgba(0,0,0,.6); color:#fff; font-size:11px; padding:2px 6px; border-radius:6px; }
    .g-card .meta { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent,rgba(0,0,0,.78)); color:#fff; font-size:11px; padding:14px 6px 5px; line-height:1.35; }
    .g-card .g-dl { position:absolute; right:6px; top:6px; background:rgba(47,123,255,.92); color:#fff; border:none; border-radius:7px; padding:4px 8px; font-size:11px; font-weight:700; cursor:pointer; }
    .g-card .g-dl:active { transform:scale(.95); }
    .g-empty { text-align:center; color:#6b7280; padding:50px 20px; font-size:15px; }
    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; flex-direction:column; z-index:20; }
    .lightbox.hidden { display:none; }
    .lb-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; color:#fff; }
    .lb-bar a { color:#7fb2ff; text-decoration:none; font-size:14px; }
    .lb-img { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; }
    .lb-img img { max-width:100%; max-height:100%; object-fit:contain; }
    .lb-info { padding:10px 14px; color:#cfd3da; font-size:13px; line-height:1.6; border-top:1px solid #23262e; }
    .lb-info b { color:#fff; }
  </style>
</head>
<body>
  <div class="g-top">
    <a href="/index.html">← 返回拍照</a>
    <h1>照片查询</h1>
  </div>

  <div class="g-search">
    <div class="g-row">
      <input id="qr" placeholder="追溯码（可只输后 8 位）" autocomplete="off" />
    </div>
    <div class="g-row">
      <input id="from" type="date" title="起始日期" />
      <input id="to" type="date" title="结束日期" />
      <input id="station" placeholder="工位（可选）" autocomplete="off" />
    </div>
    <div class="g-row">
      <button id="btnSearch" class="g-btn">查询</button>
      <button id="btnZip" class="g-btn ghost" style="display:none">下载全部 (ZIP)</button>
    </div>
  </div>

  <div id="status" class="g-status"></div>
  <div id="grid" class="g-grid"></div>

  <div id="lightbox" class="lightbox hidden">
    <div class="lb-bar">
      <a href="#" id="lbClose">✕ 关闭</a>
      <a href="#" id="lbDl">下载原图</a>
    </div>
    <div class="lb-img"><img id="lbImg" src="" alt="" /></div>
    <div class="lb-info" id="lbInfo"></div>
  </div>

  <script src="/gallery.js?v=30"></script>
</body>
</html>
