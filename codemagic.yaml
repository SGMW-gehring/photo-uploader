# Codemagic 云端构建 iOS IPA（无需本机 Mac）
# 用法：注册 codemagic.com → 关联本仓库 → 在「Teams / Personal Account → Integrations」添加 Apple 开发者账号
# → 在 Workflow 里设置环境变量 CAP_NAS_URL → 点「Start new build」
# 构建出的 IPA 用电脑上的 Sideloadly / AltStore 以你的 Apple ID 侧载到 iPhone（免费账号每 7 天需重签）

workflows:
  ios-release:
    name: iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
      vars:
        CAP_NAS_URL: http://10.0.0.10:3080   # 在 Codemagic 环境变量里改成你的 NAS 地址
    scripts:
      - name: 安装依赖
        script: npm install
      - name: 添加 iOS 平台
        script: npx cap add ios
        env:
          CAP_NAS_URL: $CAP_NAS_URL
      - name: 同步原生
        script: npx cap sync ios
        env:
          CAP_NAS_URL: $CAP_NAS_URL
      - name: 修补 Info.plist（放行局域网 HTTP + 摄像头权限）
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" $PLIST 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '用于扫描追溯码条码'" $PLIST 2>/dev/null || true
      - name: 安装 Pods
        script: cd ios/App && pod install
      - name: 构建 Archive
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -derivedDataPath build \
            -archivePath build/App.xcarchive archive
      - name: 导出 IPA（开发签名，供侧载）
        script: |
          cd ios/App
          cat > exportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - ''   # 留空则不发邮件
